name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: docker build
        run: |
          sudo docker build -t quine-relay .
      - name: docker run
        run: |
          sudo docker run --privileged --name qr -e CI=true -t quine-relay
      - name: push spoiler
        run: |
          git clone https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git spoiler --branch spoiler
          git -C spoiler rm --quiet -r '*'
          for source in \
            QR.rb QR.rs QR.scala QR.scm QR.sci QR.sed QR.spl QR.sl \
            QR.nut QR.sml QR.sq QR.ss QR.swift QR.tcl QR.tcsh QR.t \
            QR.ts QR.unl QR.vala QR.mid QR.v QR.vim QR.vb QR.wasm \
            QR.wat QR.ws QR.xslt QR.yab QR.yorick QR.azm QR.zsh qr.adb \
            QR.als QR.aheui QR.a68 QR.ante QR.aj QR.asy QR.dats QR.awk \
            QR.bash QR.bc QR.bsh QR.bef QR.Blc QR.bf QR.c QR.cpp \
            QR.cs QR.chef QR.clj QR.cmake QR.cob QR.coffee QR.lisp QR.cr \
            QR.d QR.dc QR.dhall QR.exs QR.el QR.erl QR.e QR.fsx \
            QR.false QR.fnl QR.fl QR.fish QR.fs QR.f QR.f90 QR.gbs \
            QR.g QR.gdb QR.gel QR.plt QR.go QR.gs QR.gpt QR.grass \
            QR.groovy QR.gz QR.hs QR.hx QR.icn QR.i QR.j QR.java \
            QR.js QR.jq QR.jsfuck QR.kt QR.ksh QR.lazy QR.ls QR.ll \
            QR.lol QR.lua QR.m4 QR.mk QR.mzn QR.mod QR.il QR.mustache \
            QR.asm QR.neko QR.5c QR.nim QR.m QR.ml QR.octave QR.ook \
            QR.gp QR.p QR.pas QR.pl QR.pl6 QR.php QR.png QR.pike \
            QR.ps QR.prolog QR.pr QR.py QR.R QR.ratfor QR.rc QR.rexx
          do
            sudo docker cp "qr:/usr/local/share/quine-relay/$source" spoiler/
            for variant in face rainbow rainbow-small rainbow-micro; do
              sudo docker cp "qr:/usr/local/share/quine-relay/qr-$variant/$source" "spoiler/QR-$variant${source#??}"
            done
          done
          cd spoiler
          git add .
          GIT_AUTHOR_NAME="$(git show -s --format=%an "$GITHUB_SHA")" \
          GIT_AUTHOR_EMAIL="$(git show -s --format=%ae "$GITHUB_SHA")" \
          GIT_AUTHOR_DATE="$(git show -s --format=%ad "$GITHUB_SHA")" \
          GIT_COMMITTER_NAME='GitHub Actions' \
          GIT_COMMITTER_EMAIL='actions@github.com' \
          TZ=UTC \
          git commit --allow-empty -m "spoiler: $(git show -s --format=%s "$GITHUB_SHA")"
          git push --quiet origin spoiler
          echo The intermediate sources are available: https://github.com/${GITHUB_REPOSITORY}/tree/spoiler
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
